<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D1017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Progresor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="app-head">
    <div class="brand">
      <div class="logo"><b>▲</b></div>
      <h1>PRO<span>GRESOR</span></h1>
    </div>
    <div class="head-note">tu coach de progreso</div>
  </header>

  <!-- HOME -->
  <section id="screen-home" class="screen"></section>

  <!-- LOG -->
  <section id="screen-log" class="screen"></section>

  <!-- HISTORY -->
  <section id="screen-history" class="screen"></section>

  <!-- COACH -->
  <section id="screen-coach" class="screen">
    <div class="eyebrow">Coach</div>
    <div id="chat-wrap" class="chat-wrap"></div>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen"></section>
</div>

<!-- chat input -->
<div id="chat-bar" class="chat-input-bar" style="display:none">
  <input id="chat-text" placeholder="Pregúntale a tu coach…" autocomplete="off">
  <button id="chat-send" class="send">➤</button>
</div>

<!-- tab bar -->
<nav class="tabbar">
  <button id="tab-home" class="tab active" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M4 13v7h6v-5h4v5h6v-7M2 12l10-8 10 8"/></svg>Días
  </button>
  <button id="tab-history" class="tab" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24"><path d="M4 19V5m5 14V9m5 10V7m5 12v-8"/></svg>Progreso
  </button>
  <button id="tab-coach" class="tab" onclick="switchTab('coach')">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Coach
  </button>
  <button id="tab-settings" class="tab" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2.2-1.3L14 2h-4l-.3 2.4a7 7 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.3l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2.2 1.3L10 22h4l.3-2.4a7 7 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6c.06-.43.1-.86.1-1.3z"/></svg>Ajustes
  </button>
</nav>

<input id="file-import" type="file" accept="application/json" style="display:none">

<script src="./seed.js"></script>
<script src="./app.js"></script>
</body>
</html>
